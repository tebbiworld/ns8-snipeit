#
# The Snipe-IT web installer (/setup...) is never used by the module: the
# first configuration creates the super user through ns8-snipeit.php. It is
# denied for good, also when the database is empty (Snipe-IT would redirect
# every request to /setup then). Mounted read-only into
# /etc/apache2/conf-enabled/. Case-insensitive, with or without index.php.
<LocationMatch "(?i)^/+(index\.php/+)?setup(/|$)">
    Require all denied
</LocationMatch>
