;
; /supervisord.conf of the Snipe-IT image (v8.8) without its run_schedule
; program: the module runs the Laravel scheduler from the systemd timer
; snipeit-scheduler.timer instead, so every run is in the journal and can be
; stopped with the module. Mounted read-only over the original.

[supervisord]
nodaemon=true

[program:apache]
command=apache2ctl -DFOREGROUND
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[eventlistener:exit_on_any_fatal]
command=supervisor-exit-event-listener
events=PROCESS_STATE_FATAL
